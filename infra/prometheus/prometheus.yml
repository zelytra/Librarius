global:
  scrape_interval: 15s

scrape_configs:
  - job_name: librarius-api
    metrics_path: /q/metrics
    static_configs:
      # In dev the API runs on the host (quarkus:dev); in production the
      # container service name is used instead (see prometheus.prod.yml).
      # The alert rules are deliberately not loaded here: half of them describe
      # a cluster this stack does not have, and would fire non-stop locally.
      - targets: ['host.docker.internal:8080']
