global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules are evaluated here and visible under Alerts in the Prometheus UI.
# No Alertmanager is wired into this stack yet: add an `alerting:` block below
# once a notification channel exists (docs/DEPLOYMENT.md § "Alerting").
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: librarius-api
    metrics_path: /q/metrics
    static_configs:
      - targets: ['api:8080']
