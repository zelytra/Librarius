# Production stack of My Library (Librarius), built on the GHCR images produced
# by .github/workflows/release.yml.
#
# Credentials come from the environment only: POSTGRES_PASSWORD,
# KEYCLOAK_ADMIN_PASSWORD and GF_ADMIN_PASSWORD have no default, so the stack
# refuses to start rather than fall back to a password published here. Copy
# .env.example to .env (git-ignored) and fill it in.
#
# ⚠️ OIDC / Keycloak: the token issuer must be identical on the browser side
# (which logs in) and on the API side (which validates). Pick a stable public
# hostname for Keycloak (KC_HOSTNAME) and use that same public URL for
# OIDC_AUTH_SERVER_URL and VITE_OIDC_AUTHORITY (web build).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-librarius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-librarius}
    volumes:
      - librarius-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: ['start', '--import-realm', '--http-port=8081', '--hostname-strict=false']
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in infra/.env}
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8081}
      KC_HTTP_ENABLED: 'true'
    ports:
      - '8081:8081'
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped

  api:
    image: ghcr.io/zelytra/librarius-api:latest
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-librarius}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-librarius}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      OIDC_AUTH_SERVER_URL: ${OIDC_AUTH_SERVER_URL:-http://localhost:8081/realms/librarius}
      # Browsers send an Origin header on writes even same-origin: without the public
      # origin allowed, every POST, PUT and DELETE is rejected with a 403.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088}
    depends_on:
      - postgres
      - keycloak
    restart: unless-stopped

  web:
    image: ghcr.io/zelytra/librarius-web:latest
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8088}:80'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      # The rules live in the Helm chart because Helm can only read files under
      # the chart directory, and one copy of them is worth more than a tidy path.
      # This stack mounts that same file rather than keeping a second one.
      - ./helm/librarius/files/librarius.rules.yml:/etc/prometheus/rules/librarius.rules.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in infra/.env}
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  librarius-pgdata:
