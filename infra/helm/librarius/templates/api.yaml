{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  # Recreate: replace in place, without a surge pod (CPU-constrained node).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "librarius.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librarius.selector" (dict "ctx" . "component" "api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_HTTP_HOST
              value: "0.0.0.0"
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}"
            - name: QUARKUS_DATASOURCE_USERNAME
              value: {{ .Values.postgres.user | quote }}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "librarius.postgres.secretName" . }}
                  key: {{ .Values.postgres.secretKey }}
            # Internal discovery + backchannel; the issuer stays the public URL
            # (KC_HOSTNAME + dynamic backchannel on the Keycloak side).
            - name: OIDC_AUTH_SERVER_URL
              value: "http://{{ .Release.Name }}-keycloak:8081/auth/realms/librarius"
            # The PWA and the API share a host, but browsers still send an Origin header
            # on writes: without the public origin allowed, every POST, PUT and DELETE
            # comes back 403.
            - name: CORS_ORIGINS
              value: "https://{{ .Values.domain }}"
          readinessProbe:
            httpGet: { port: 8080, path: /q/health/ready }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { port: 8080, path: /q/health/live }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    {{- include "librarius.selector" (dict "ctx" . "component" "api") | nindent 4 }}
{{- end }}
