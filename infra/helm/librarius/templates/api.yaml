{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- else }}
  # replicas is deliberately absent: the HPA owns the count, and a value here
  # would be reasserted by every `helm upgrade` and undone again by the HPA
  # moments later — a deployment that resets the scale-out it was deployed into.
  {{- end }}
  strategy:
    type: {{ .Values.api.strategy }}
    {{- if eq .Values.api.strategy "RollingUpdate" }}
    # maxUnavailable 0: the old pod keeps serving until the new one reports
    # ready, which is what makes the release invisible. maxSurge 1 is what the
    # node can absorb — the CPU arithmetic is in docs/DEPLOYMENT.md.
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "librarius.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librarius.selector" (dict "ctx" . "component" "api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 30s ceiling: 5s of preStop, then Quarkus closing its in-flight requests
      # and its JDBC pool. Reached only if a request outlives the hook.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_HTTP_HOST
              value: "0.0.0.0"
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}"
            - name: QUARKUS_DATASOURCE_USERNAME
              value: {{ .Values.postgres.user | quote }}
            # The pool ceiling is a shared budget, not a per-pod setting: one
            # PostgreSQL serves the api, Keycloak and the backup job, and the
            # number of api pods is something only the chart knows. Overrides the
            # 50 in application.properties, which is sized for a compose run
            # where nothing else touches the instance. See values.yaml and
            # docs/DEPLOYMENT.md § "Scaling out".
            - name: QUARKUS_DATASOURCE_JDBC_MAX_SIZE
              value: {{ .Values.api.datasource.maxSize | quote }}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "librarius.postgres.secretName" . }}
                  key: {{ .Values.postgres.secretKey }}
            # Internal discovery + backchannel; the issuer stays the public URL
            # (KC_HOSTNAME + dynamic backchannel on the Keycloak side).
            - name: OIDC_AUTH_SERVER_URL
              value: "http://{{ .Release.Name }}-keycloak:8081/auth/realms/librarius"
            # The PWA and the API share a host, but browsers still send an Origin header
            # on writes: without the public origin allowed, every POST, PUT and DELETE
            # comes back 403.
            - name: CORS_ORIGINS
              value: "https://{{ .Values.domain }}"
            {{- /*
            Catalog quota. The counter is per-instance and in memory, so N pods
            enforce it N times; these exist so the aggregate can be held when the
            deployment scales out. Absent by default — the API's own 30/500 then
            applies, multiplied by the replica count. values.yaml says why that
            is acceptable at 2 replicas.
            */}}
            {{- with .Values.api.catalogRateLimit.perMinute }}
            - name: LIBRARIUS_CATALOG_RATE_LIMIT_PER_MINUTE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.catalogRateLimit.perDay }}
            - name: LIBRARIUS_CATALOG_RATE_LIMIT_PER_DAY
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.api.accountDeletion.enabled }}
            {{- if not .Values.api.accountDeletion.existingSecret }}
            {{- fail "api.accountDeletion.existingSecret is required when api.accountDeletion.enabled is true (see docs/DEPLOYMENT.md § Account deletion)" }}
            {{- end }}
            # Admin API, cluster-internal: the same Keycloak the tokens come from, reached
            # on its service rather than through the ingress.
            - name: KEYCLOAK_ADMIN_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN_SERVER_URL
              value: "http://{{ .Release.Name }}-keycloak:8081/auth"
            - name: KEYCLOAK_ADMIN_REALM
              value: "librarius"
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ .Values.api.accountDeletion.clientId | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.accountDeletion.existingSecret }}
                  key: {{ .Values.api.accountDeletion.secretKey }}
            {{- end }}
          # Removing the pod from the Service endpoints and sending it SIGTERM are
          # concurrent, so without this pause Traefik keeps routing to a container
          # that has already begun to stop. Native sleep action, k8s ≥ 1.30.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # A JVM boot is slow, not unhealthy. The startup probe holds the other
          # two off entirely until the HTTP layer answers, so a cold start can
          # never be read as a liveness failure — which is what the previous
          # settings did: liveness gave up at 50s against a boot measured at 25s.
          # 30 × 5s = 150s of budget, Flyway migrations included.
          startupProbe:
            httpGet: { port: 8080, path: /q/health/started }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { port: 8080, path: /q/health/ready }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { port: 8080, path: /q/health/live }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    {{- include "librarius.selector" (dict "ctx" . "component" "api") | nindent 4 }}
{{- end }}
