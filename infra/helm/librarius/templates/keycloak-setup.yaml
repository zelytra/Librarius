{{- if .Values.keycloak.enabled }}
{{- /*
Keeps the existing realm in line with the chart, on every deploy (#381, #73, #177).

`--import-realm` only imports a realm that does not exist yet, so anything the realm
JSON gained after the first deploy never reached staging: the session lifetimes of #371
among it, and the service account account deletion needs. This Job applies both to the
live realm with kcadm, the admin CLI shipped in the Keycloak image, using the admin
account the chart already configures. Every step is idempotent.

A plain Job, not a Helm hook: the deploy does not `--wait` (see cd.yml), and a hook would
block the upgrade while Keycloak restarts. Its name carries the release revision, so each
deploy runs it once; cd.yml waits for it after the rollouts.
*/ -}}
{{- $apiAdmin := .Values.api.accountDeletion }}
{{- $generated := and $apiAdmin.enabled (not $apiAdmin.existingSecret) }}
{{- if $generated }}
{{- $name := printf "%s-keycloak-api-admin" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
  annotations:
    # Never deleted with the release: the client in Keycloak holds the same value.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Generated once, then read back from the cluster on every later deploy, so the
  # secret is stable without ever being written in this repository.
  {{ $apiAdmin.secretKey }}: {{ if and $existing (index $existing.data $apiAdmin.secretKey) }}{{ index $existing.data $apiAdmin.secretKey }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-keycloak-setup-{{ .Release.Revision }}
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "keycloak-setup") | nindent 4 }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "librarius.labels" (dict "ctx" . "component" "keycloak-setup") | nindent 8 }}
    spec:
      restartPolicy: Never
      # No pod of this chart calls the Kubernetes API, and each runs under the runtime's seccomp
      # profile (#582).
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kcadm
          image: {{ .Values.keycloak.image }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            {{- include "librarius.containerHardening" (dict) | nindent 12 }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              kc=/opt/keycloak/bin/kcadm.sh
              server="http://{{ .Release.Name }}-keycloak:8081/auth"

              # Keycloak may still be starting (Recreate stops it first): wait up to 10 min.
              for i in $(seq 1 120); do
                if $kc config credentials --server "$server" --realm master \
                     --user "$KC_ADMIN" --password "$KC_ADMIN_PASSWORD" >/dev/null 2>&1; then
                  break
                fi
                [ "$i" = 120 ] && { echo "Keycloak never answered at $server"; exit 1; }
                sleep 5
              done

              # Session lifetimes (#381): what the realm JSON says, on the live realm.
              $kc update realms/librarius \
                -s ssoSessionIdleTimeout={{ .Values.keycloak.sessions.idle }} \
                -s ssoSessionMaxLifespan={{ .Values.keycloak.sessions.max }} \
                -s offlineSessionIdleTimeout={{ .Values.keycloak.sessions.offlineIdle }}
              echo "realm session lifetimes applied"

              # Hardening (#579, #581, #584), on the live realm like the lifetimes above.
              # Ten failed passwords lock an account for a minute, then longer each time, up
              # to fifteen minutes; a password has ten characters at least and is neither the
              # username nor the e-mail; a refresh token is rotated and works twice at most — once
              # for the two tabs that refresh in the same instant — so a stolen one dies soon; sign-ins and admin changes are kept thirty days.
              # E-mail verification waits for an SMTP server the chart does not have yet.
              $kc update realms/librarius \
                -s bruteForceProtected=true -s permanentLockout=false \
                -s failureFactor=10 -s waitIncrementSeconds=60 \
                -s maxFailureWaitSeconds=900 -s maxDeltaTimeSeconds=43200 \
                -s 'passwordPolicy=length(10) and notUsername and notEmail' \
                -s revokeRefreshToken=true -s refreshTokenMaxReuse=1 \
                -s eventsEnabled=true -s eventsExpiration=2592000 \
                -s adminEventsEnabled=true -s adminEventsDetailsEnabled=false
              echo "realm hardening applied"

              # The web client signs in through the browser only (#578): a public client that
              # took the password grant let anyone try credentials without the sign-in page.
              web_id=$($kc get clients -r librarius -q clientId=librarius-web --fields id --format csv --noquotes)
              if [ -n "$web_id" ]; then
                $kc update "clients/$web_id" -r librarius -s directAccessGrantsEnabled=false
                echo "client librarius-web: password grant off"
              fi

              # The admin role (#488): created on a realm imported before it existed, granted
              # to no one — the owner gives it by hand in the Keycloak console.
              $kc get roles/admin -r librarius >/dev/null 2>&1 \
                || $kc create roles -r librarius -s name=admin \
                     -s "description=Instance administration (reports, monitoring)"
              echo "admin role present"

              # The user profile (#538): Keycloak 25's own, with first and last name optional
              # (files/keycloak-user-profile.json). Required, they made Keycloak stop a reader
              # signing in with Google or Apple for the first time — which hands over nothing
              # but the e-mail — on a form asking for both. The reader names themselves in the
              # app instead.
              $kc update users/profile -r librarius -f - <<'PROFILE'
              {{- .Files.Get "files/keycloak-user-profile.json" | nindent 14 }}
              PROFILE
              echo "user profile applied"

              # Sign in with Google and Apple (#177), each on when its Secret exists. Only the
              # e-mail scope is asked for (#538): no name or picture leaves the provider. Both
              # providers verify the address, so it is trusted; IMPORT copies it once and never
              # overwrites what the reader changes afterwards.
              upsert_idp() { # upsert_idp <alias> <kcadm -s arguments…>
                local alias=$1; shift
                if $kc get "identity-provider/instances/$alias" -r librarius >/dev/null 2>&1; then
                  $kc update "identity-provider/instances/$alias" -r librarius "$@"
                  echo "identity provider $alias updated"
                else
                  $kc create identity-provider/instances -r librarius -s "alias=$alias" "$@"
                  echo "identity provider $alias created"
                fi
              }
              {{- if include "librarius.idp.enabled" (dict "ctx" . "idp" "google") }}
              upsert_idp google -s providerId=google -s displayName=Google -s enabled=true \
                -s trustEmail=true -s config.syncMode=IMPORT -s config.guiOrder=1 \
                -s 'config.defaultScope=openid email' \
                -s "config.clientId=$GOOGLE_CLIENT_ID" -s "config.clientSecret=$GOOGLE_CLIENT_SECRET"
              {{- end }}
              {{- if include "librarius.idp.enabled" (dict "ctx" . "idp" "apple") }}
              # The deploy that turns Apple on also restarts Keycloak with the extension: wait
              # for the restarted one rather than fail against the pod on its way out.
              for i in $(seq 1 120); do
                [[ $($kc get serverinfo 2>/dev/null) == *'"apple"'* ]] && break
                [ "$i" = 120 ] && { echo "Keycloak never loaded the Apple provider"; exit 1; }
                sleep 5
                $kc config credentials --server "$server" --realm master \
                  --user "$KC_ADMIN" --password "$KC_ADMIN_PASSWORD" >/dev/null 2>&1 || true
              done
              # The extension takes the raw .p8 key as client secret and signs the JWT Apple
              # wants from it on each sign-in, so nothing here expires every six months.
              apple_key=${APPLE_PRIVATE_KEY//$'\r'/}
              upsert_idp apple -s providerId=apple -s displayName=Apple -s enabled=true \
                -s trustEmail=true -s config.syncMode=IMPORT -s config.guiOrder=2 \
                -s config.defaultScope=email \
                -s "config.clientId=$APPLE_CLIENT_ID" -s "config.teamId=$APPLE_TEAM_ID" \
                -s "config.keyId=$APPLE_KEY_ID" -s "config.clientSecret=${apple_key//$'\n'/}"
              {{- end }}

              # The native app's client (#528). The realm JSON gained it after staging's realm
              # was first imported, so only this Job can put it there. Public and PKCE-only:
              # an installed application cannot keep a secret. `webOrigins` lists the two
              # origins the container sends by hand — "+" derives them from the redirect URIs,
              # and a custom scheme derives nothing, which would fail the token exchange on
              # CORS after a sign-in that looked successful.
              mobile_args=(
                -s enabled=true -s publicClient=true -s standardFlowEnabled=true
                -s directAccessGrantsEnabled=false -s implicitFlowEnabled=false
                -s 'redirectUris=["fr.zelytra.librarius://auth"]'
                -s 'webOrigins=["https://localhost","capacitor://localhost"]'
                -s 'attributes."pkce.code.challenge.method"=S256'
                -s 'attributes."post.logout.redirect.uris"=fr.zelytra.librarius://auth'
              )
              mobile_id=$($kc get clients -r librarius -q clientId=librarius-mobile --fields id --format csv --noquotes)
              if [ -z "$mobile_id" ]; then
                $kc create clients -r librarius -s clientId=librarius-mobile \
                  -s 'name=Librarius native app' "${mobile_args[@]}"
                echo "client librarius-mobile created"
              else
                $kc update "clients/$mobile_id" -r librarius "${mobile_args[@]}"
                echo "client librarius-mobile updated"
              fi

              {{- if $apiAdmin.enabled }}

              # Account deletion (#73): a confidential client with a service account that
              # may manage users, and nothing else.
              client={{ $apiAdmin.clientId | quote }}
              id=$($kc get clients -r librarius -q clientId="$client" --fields id --format csv --noquotes)
              if [ -z "$id" ]; then
                $kc create clients -r librarius -s clientId="$client" -s enabled=true \
                  -s publicClient=false -s serviceAccountsEnabled=true \
                  -s standardFlowEnabled=false -s directAccessGrantsEnabled=false \
                  -s implicitFlowEnabled=false -s "secret=$API_ADMIN_SECRET"
                echo "client $client created"
              else
                $kc update "clients/$id" -r librarius -s enabled=true \
                  -s serviceAccountsEnabled=true -s "secret=$API_ADMIN_SECRET"
                echo "client $client updated"
              fi
              $kc add-roles -r librarius --uusername "service-account-$client" \
                --cclientid realm-management --rolename manage-users
              echo "service account may manage users"
              {{- end }}
          env:
            - name: KC_ADMIN
              value: {{ .Values.keycloak.admin | quote }}
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "librarius.keycloak.secretName" . }}
                  key: {{ .Values.keycloak.secretKey }}
            {{- if include "librarius.idp.enabled" (dict "ctx" . "idp" "google") }}
            {{- $google := .Values.keycloak.identityProviders.google.secretName }}
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: {{ $google }}, key: client-id } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ $google }}, key: client-secret } }
            {{- end }}
            {{- if include "librarius.idp.enabled" (dict "ctx" . "idp" "apple") }}
            {{- $apple := .Values.keycloak.identityProviders.apple.secretName }}
            - name: APPLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: {{ $apple }}, key: client-id } }
            - name: APPLE_TEAM_ID
              valueFrom: { secretKeyRef: { name: {{ $apple }}, key: team-id } }
            - name: APPLE_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ $apple }}, key: key-id } }
            - name: APPLE_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: {{ $apple }}, key: private-key } }
            {{- end }}
            {{- if $apiAdmin.enabled }}
            - name: API_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "librarius.apiAdmin.secretName" . }}
                  key: {{ $apiAdmin.secretKey }}
            {{- end }}
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
{{- end }}
