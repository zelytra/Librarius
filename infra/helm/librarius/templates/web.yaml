apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-nginx
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "web") | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        location = /healthz { add_header Content-Type text/plain; return 200 'ok'; }
        location / { try_files $uri $uri/ /index.html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- else }}
  # Left out on purpose while the HPA owns the count — see the same comment on
  # the api Deployment.
  {{- end }}
  strategy:
    type: {{ .Values.web.strategy }}
    {{- if eq .Values.web.strategy "RollingUpdate" }}
    # nginx and a static bundle: a surge pod costs 25m of CPU request and is
    # ready in a few seconds, which the node absorbs without trouble.
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "librarius.selector" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librarius.selector" (dict "ctx" . "component" "web") | nindent 8 }}
      annotations:
        checksum/config: {{ tpl (toString .Values.web.image.tag) . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # nginx stops in well under this; the window exists for the preStop pause.
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          # Same endpoint race as the api: keep answering while Traefik learns the
          # pod is going away. Native sleep action, k8s ≥ 1.30.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # nginx listens almost immediately, so the probe cadence — not the
          # server — is what decides how long the roll takes. 2s + 2s beats the
          # 11s the previous 3s/5s settings produced.
          readinessProbe:
            httpGet: { port: 80, path: /healthz }
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { port: 80, path: /healthz }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Release.Name }}-web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    {{- include "librarius.selector" (dict "ctx" . "component" "web") | nindent 4 }}
