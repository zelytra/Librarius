{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-realm
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
data:
  # Imported on the first Keycloak startup only. No user is seeded here: a
  # credential written in this chart would be a credential published in a public
  # repository. Self-registration is open, accounts are created through the UI.
  librarius-realm.json: |
    {
      "realm": "librarius",
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": true,
      "loginWithEmailAllowed": true,
      "displayName": "Ma Bibliothèque",
      "loginTheme": "librarius",
      "internationalizationEnabled": true,
      "supportedLocales": ["fr", "en"],
      "defaultLocale": "fr",
      "roles": { "realm": [{ "name": "user" }] },
      "defaultRoles": ["user"],
      "clients": [
        {
          "clientId": "librarius-web", "name": "Librarius PWA", "enabled": true,
          "publicClient": true, "standardFlowEnabled": true, "directAccessGrantsEnabled": true,
          "redirectUris": ["https://{{ .Values.domain }}/*"],
          "webOrigins": ["+"],
          "attributes": { "pkce.code.challenge.method": "S256", "post.logout.redirect.uris": "+" }
        }
      ]
    }
---
# The login theme the realm above asks for. Four files, projected into the theme
# directory Keycloak reads at runtime — no image is built for it.
#
# Why not a custom image, which is how `web` and `api` reach the cluster: a third
# GHCR package would have to be published, made public by hand and pulled on a node
# where a slow pull is already how #125 failed, all to carry 13 kB of CSS on top of
# a 450 MB upstream image. Worse, `cd.yml` stamps the images it builds with the
# commit sha, so Keycloak — the one component here holding its sessions in memory —
# would be replaced on every merge into `main`, signing everybody out for a
# stylesheet that did not change. A ConfigMap costs the node nothing, changes only
# when the theme does, and leaves `keycloak.image` pinned to the upstream release.
#
# The files live under the chart because `.Files.Get` cannot read outside it, and
# the compose stacks mount that same directory rather than keeping a copy — the
# arrangement `files/librarius.rules.yml` already uses.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-theme
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
data:
  # A key cannot carry a slash; the volume below maps each one to its path.
  theme.properties: |
{{ .Files.Get "files/keycloak-theme/login/theme.properties" | indent 4 }}
  librarius.css: |
{{ .Files.Get "files/keycloak-theme/login/resources/css/librarius.css" | indent 4 }}
  messages_fr.properties: |
{{ .Files.Get "files/keycloak-theme/login/messages/messages_fr.properties" | indent 4 }}
  messages_en.properties: |
{{ .Files.Get "files/keycloak-theme/login/messages/messages_en.properties" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
spec:
  replicas: 1
  # A single replica cannot roll without a gap anyway, and the default surge asks
  # the node for a second Keycloak JVM it does not have room for — the release then
  # sits with the new pod Pending while the old one keeps serving. Recreate
  # (set on the resource-tight node, see the api's strategy) stops the old pod
  # first; user sessions survive it since V<persistent-user-sessions> moved them
  # into Postgres, so the restart is no longer the logout it once was.
  strategy:
    type: {{ .Values.keycloak.strategy }}
    {{- if eq .Values.keycloak.strategy "RollingUpdate" }}
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "librarius.selector" (dict "ctx" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librarius.selector" (dict "ctx" . "component" "keycloak") | nindent 8 }}
      annotations:
        # Keycloak reads a theme off the disk at boot and caches it. Without this,
        # editing the theme would update the ConfigMap and change nothing on screen
        # until somebody restarted the pod by hand — the same silent gap the
        # Prometheus rules carry a checksum for. The realm is deliberately *not*
        # part of it: it is imported once, on an empty database, so restarting on a
        # realm edit would promise an update that does not happen. See
        # docs/DEPLOYMENT.md § "Changing the realm of a running Keycloak".
        checksum/theme: {{ printf "%s|%s|%s|%s"
          (.Files.Get "files/keycloak-theme/login/theme.properties")
          (.Files.Get "files/keycloak-theme/login/resources/css/librarius.css")
          (.Files.Get "files/keycloak-theme/login/messages/messages_fr.properties")
          (.Files.Get "files/keycloak-theme/login/messages/messages_en.properties")
          | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          # persistent-user-sessions writes online sessions to the keycloak PostgreSQL database
          # instead of the in-memory Infinispan cache, so a pod restart — a helm upgrade, a theme
          # change (the checksum annotation below forces one), a manual rollout — reloads them
          # rather than logging every signed-in user out. A single replica has no failover, so
          # this is the only thing that keeps a session across a redeploy. Preview feature on the
          # pinned 25.x image; the default from Keycloak 26.
          args: ["start", "--import-realm", "--features=persistent-user-sessions"]
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.admin | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "librarius.keycloak.secretName" . }}
                  key: {{ .Values.keycloak.secretKey }}
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_PORT
              value: "8081"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/auth"
            - name: KC_HOSTNAME
              value: "https://{{ .Values.domain }}/auth"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/{{ .Values.keycloak.database }}"
            - name: KC_DB_USERNAME
              value: {{ .Values.postgres.user | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "librarius.postgres.secretName" . }}
                  key: {{ .Values.postgres.secretKey }}
            # Keycloak's own default is 100, i.e. the whole of PostgreSQL's
            # `max_connections`. Declared so the api's pools have a budget left
            # to be sized against — docs/DEPLOYMENT.md § "Scaling out".
            - name: KC_DB_POOL_MAX_SIZE
              value: {{ .Values.keycloak.dbPoolMaxSize | quote }}
          ports:
            - containerPort: 8081
            - containerPort: 9000
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
            # A subdirectory, not /opt/keycloak/themes itself: mounting the parent
            # would hide whatever the image ships there. `librarius` extends
            # `keycloak.v2`, which lives inside a jar and is unaffected either way.
            - name: theme
              mountPath: /opt/keycloak/themes/librarius
          readinessProbe:
            httpGet: { port: 8081, path: /auth/realms/librarius }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: realm
          configMap:
            name: {{ .Release.Name }}-keycloak-realm
        # `path` is what rebuilds the directory tree a theme has to have: the
        # ConfigMap keys are flat because a key cannot contain a slash.
        - name: theme
          configMap:
            name: {{ .Release.Name }}-keycloak-theme
            items:
              - key: theme.properties
                path: login/theme.properties
              - key: librarius.css
                path: login/resources/css/librarius.css
              - key: messages_fr.properties
                path: login/messages/messages_fr.properties
              - key: messages_en.properties
                path: login/messages/messages_en.properties
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    {{- include "librarius.selector" (dict "ctx" . "component" "keycloak") | nindent 4 }}
{{- end }}
