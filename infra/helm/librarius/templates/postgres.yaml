{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
data:
  # Creates the Keycloak database next to the API one (on first startup).
  10-keycloak-db.sql: |
    SELECT 'CREATE DATABASE {{ .Values.keycloak.database }}'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ .Values.keycloak.database }}')\gexec
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "librarius.selector" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "librarius.selector" (dict "ctx" . "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          # The entrypoint prepends `postgres` to anything starting with a dash,
          # so this is a server setting rather than a replacement command. It is
          # the ceiling the api, Keycloak and the backup job carve their pools
          # out of, and it is stated here so that the budget in
          # docs/DEPLOYMENT.md § "Scaling out" is not resting on an image default.
          args: ["-c", "max_connections={{ .Values.postgres.maxConnections }}"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "librarius.postgres.secretName" . }}
                  key: {{ .Values.postgres.secretKey }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-postgres
        - name: init
          configMap:
            name: {{ .Release.Name }}-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "librarius.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    {{- include "librarius.selector" (dict "ctx" . "component" "postgres") | nindent 4 }}
{{- end }}
