# French copy of the login pages, overriding two keys of Keycloak's own bundle.
# Everything else — every label, every error, every form — is already translated
# upstream and is left alone: `base/login/messages/messages_fr.properties` ships
# with the server. Encoding is UTF-8, as it is for the bundles this file extends.
#
# Both keys below are read through java.text.MessageFormat, which treats a single
# quote as an escape character. An apostrophe added here has to be doubled ('').

# The heading above the card. Keycloak's default is the realm's `displayNameHtml`
# attribute, which the realm does not set, so the page had no name on it at all.
# This is the app's own `app.name`.
loginTitleHtml=Ma Bibliothèque

# The browser tab. The default interpolates the realm's `displayName`, which is a
# single string for every locale — so the English page announced itself in French.
loginTitle=Se connecter à Ma Bibliothèque

# The accessible name of the password-visibility toggle. Keycloak 25 ships these
# two keys in English only — `base/login/messages/messages_fr.properties` has no
# entry for either — so the French form announced an English label to a screen
# reader. Remove them once the server carries its own translation.
showPassword=Afficher le mot de passe
hidePassword=Masquer le mot de passe

# The two entries of the language selector. Each language is named in its own
# language and never translated, the rule `apps/web/src/i18n/languages.ts` states
# and for the same reason: somebody who lands on the wrong one has to be able to
# read their way out of it. Keycloak's own default is the Java display name, which
# calls English « Anglais » on the page a French speaker is trying to leave.
locale_fr=Français
locale_en=English
