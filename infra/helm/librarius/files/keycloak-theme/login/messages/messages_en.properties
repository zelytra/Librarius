# English copy of the login pages. Same two keys as messages_fr.properties, and
# the same rules: UTF-8, and a single quote is a MessageFormat escape.
#
# The names come from `apps/web/src/i18n/locales/en.json` (`app.name`), so the
# page calls the application what the application calls itself.

loginTitleHtml=My Library

loginTitle=Sign in to My Library

# Endonyms, as in messages_fr.properties: the same two labels on both pages.
locale_fr=Français
locale_en=English
