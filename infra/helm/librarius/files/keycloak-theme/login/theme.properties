# Librarius login theme — the sign-in pages, dressed like the application.
#
# It is CSS and two message files, and nothing else: no FreeMarker template is
# overridden. That is the whole design. Every page of the `login` type shares
# keycloak.v2's `template.ftl`, so restyling that shell restyles sign-in,
# registration, the password reset, the e-mail verification, the OTP forms and the
# error and info pages in one file — and a Keycloak upgrade that changes the markup
# of a form cannot leave this theme rendering a copy of last year's.
#
# parent=keycloak.v2 is Keycloak 25's own login theme, and the one the realm falls
# back to today. Inheriting it keeps its PatternFly 5 base, its accessibility work
# and its password-visibility script.
parent=keycloak.v2
import=common/keycloak

# Appended to the parent's stylesheet, not a replacement for it: `css/styles.css`
# is missing from this theme, so Keycloak resolves it up the chain to keycloak.v2's
# own, and `css/librarius.css` lands after it.
styles=css/styles.css css/librarius.css
