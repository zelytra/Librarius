## My Library (Librarius) — full stack on Kubernetes.
## Single host: librarius.zelytra.fr (web), /api + /q → api, /auth → keycloak.
## Credentials never live here, they come from Kubernetes Secrets (docs/DEPLOYMENT.md).

domain: librarius.zelytra.fr

# Empty on purpose: the two GHCR packages are public, so the kubelet pulls them
# anonymously and no credential is involved. A pull secret was worse than useless
# here — the kubelet does not fall back to an anonymous pull once a pod carries
# one, so an expired token broke the pull of an image anybody could fetch. See
# docs/DEPLOYMENT.md § "Pulling the images". Set this to
# `- name: <secret>` to deploy from a registry that does require credentials.
imagePullSecrets: []

ingress:
  enabled: true
  className: traefik
  clusterIssuer: letsencrypt-prod
  tlsSecretName: librarius-zelytra-fr-tls

# ── Frontend (PWA) ────────────────────────────────────────────────────────────
web:
  image:
    repository: ghcr.io/zelytra/librarius-web
    tag: "0.4.0"
    pullPolicy: IfNotPresent
  replicas: 1
  # RollingUpdate (maxSurge 1, maxUnavailable 0): the replacement pod has to be
  # Ready before the old one is stopped, so a release drops no request. See
  # docs/DEPLOYMENT.md § "Deploying without downtime" for the node arithmetic.
  strategy: RollingUpdate
  # 25m: nginx serving a static bundle draws 1m and 6Mi in steady state on the
  # cluster (measured over 6 minutes). The old value of 50m was a guess, and on a
  # node whose CPU requests are 96% committed, 25m of guess is the difference
  # between a surge pod that schedules and one that waits.
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 200m, memory: 192Mi }

# ── API (Quarkus) ─────────────────────────────────────────────────────────────
api:
  enabled: true
  image:
    repository: ghcr.io/zelytra/librarius-api
    tag: "0.4.0"
    pullPolicy: IfNotPresent
  replicas: 1
  # RollingUpdate surges a second API pod, so the new one runs its Flyway
  # migrations while the old one still serves traffic: a migration that is not
  # backward compatible breaks the old pod for the ~30s of the overlap. Deploy
  # such a migration with `--set api.strategy=Recreate`, which trades the
  # downtime back for the safety. docs/DEPLOYMENT.md § "Deploying without
  # downtime".
  strategy: RollingUpdate
  # 100m: the JVM draws 4-8m and 222Mi in steady state (measured over 6 minutes).
  # The request is a scheduling floor, not a budget — boot bursts up to the 1 CPU
  # limit and is not throttled by it. 150m was too much to surge on this node.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }
  # Deleting an account (GDPR art. 17) deletes the Keycloak login too, which needs a
  # service account. Off by default, and no credential is invented: while this is off,
  # DELETE /api/me answers 503 and erases nothing — never the reverse, which would leave
  # a working login in front of a library that no longer exists.
  # What to create first: docs/DEPLOYMENT.md § "Account deletion".
  accountDeletion:
    enabled: false
    # Client id of the service account, in the `librarius` realm.
    clientId: librarius-api-admin
    # Secret holding its client secret. Created by hand, never by the chart.
    existingSecret: ""
    secretKey: admin-client-secret

# ── Disruption budget ─────────────────────────────────────────────────────────
# Keeps an involuntary eviction (a descheduler, a stray `kubectl drain`) from
# taking the only replica of web or api down. It does *not* govern a rolling
# update: a Deployment replaces pods directly, it does not evict them.
#
# ⚠️ With replicas: 1, `minAvailable: 1` means a deliberate node drain blocks
# instead of proceeding. That is the point, but on a single-node cluster the
# drain is usually intentional — use `kubectl drain --disable-eviction`, or
# deploy with `--set podDisruptionBudget.enabled=false` first.
podDisruptionBudget:
  enabled: true

# ── PostgreSQL ────────────────────────────────────────────────────────────────
postgres:
  enabled: true
  image: postgres:16-alpine
  user: librarius
  database: librarius
  # Password: read from an existing Kubernetes Secret, never from this file.
  # The chart ships no default and refuses to render while existingSecret is
  # empty. Creating the Secret is a manual step, see docs/DEPLOYMENT.md.
  existingSecret: ""
  secretKey: postgres-password
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ── Keycloak (auth) ───────────────────────────────────────────────────────────
keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:25.0.6
  admin: admin
  # Admin console password: same rule as postgres above, Secret only.
  existingSecret: ""
  secretKey: admin-password
  database: keycloak
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 768Mi }

# ── Monitoring & alerting (Prometheus + Alertmanager) ─────────────────────────
# On by default, because rules that nothing evaluates are what issue #60 is
# about. Two pods, no CRD, no cluster-scoped RBAC — see the header of
# templates/monitoring.yaml for why not kube-prometheus-stack, and
# docs/DEPLOYMENT.md § "Alerting" for the node arithmetic.
monitoring:
  enabled: true
  # Stamped on every series as `environment`, so a notification says which
  # deployment it came from. Production (#103) will set this to `production`.
  environment: staging
  prometheus:
    image: prom/prometheus:v2.53.0
    # 24h, on an emptyDir. Alerting reads at most the last 10 minutes, and a
    # `local-path` PVC here would pin the pod to the node and add a volume worth
    # backing up that holds nothing anybody would miss. Restarting Prometheus
    # costs the graphs, not the alerts: every rule is firing again within two
    # evaluation cycles. Raise both if this ever feeds a Grafana on the cluster.
    retention: 24h
    retentionSize: 384MB
    storageSize: 512Mi
    # 20m/128Mi: measured, not guessed. Scraping two targets every 30s and
    # evaluating ten rules drew 2.5m of CPU at startup, under 1m afterwards, and
    # 36Mi resident after 11 minutes (docs/DEPLOYMENT.md § "Alerting" carries the
    # measurement). CPU requests are the scarce resource on this node, so the
    # request is a floor a little above what was measured rather than a
    # comfortable round number.
    resources:
      requests: { cpu: 20m, memory: 128Mi }
      limits: { cpu: 300m, memory: 384Mi }
  alertmanager:
    enabled: true
    image: prom/alertmanager:v0.27.0
    # Secret holding the notification destination — a webhook URL is itself a
    # credential, so it never lands in this file. Empty means alerts are still
    # evaluated, grouped and visible, and no notification leaves the cluster;
    # what is watched from outside stays covered by the `uptime` workflow.
    # Create the Secret, then deploy with
    # --set monitoring.alertmanager.existingSecret=librarius-alerting
    existingSecret: ""
    secretKey: webhook-url
    # webhook — generic JSON POST (ntfy, Gotify, Mattermost, a bot).
    # slack   — Slack incoming webhook, and Discord with `/slack` appended.
    receiverType: webhook
    slackChannel: "#alerts"
    repeatInterval:
      # Repeats while it is still firing. Critical nags, warning does not.
      critical: 4h
      warning: 24h
    # 10m/48Mi: measured at 16m of CPU while it boots and gossips, ~2m and 20Mi
    # once settled. The request is a scheduling floor, not a cap — the boot
    # burst is covered by the limit.
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { cpu: 100m, memory: 128Mi }

# ── PostgreSQL backups (CronJob → S3-compatible storage) ──────────────────────
# Off by default. The destination bucket, its provider and its credentials are
# an operator decision: the chart neither invents them nor ships a default, and
# an existing release gains no CronJob until this is turned on deliberately.
# What has to be created first: docs/DEPLOYMENT.md § "Automated backups".
backup:
  enabled: false
  # UTC. Off-peak, and late enough that a daily run never overlaps a deployment.
  schedule: "15 2 * * *"
  # No image is built for this. The dump runs in the PostgreSQL image (pg_dump,
  # gzip); the encryption and the upload run in the AWS CLI image, which ships
  # gpg. Both are pinned: an unpinned backup job is a backup job that changes
  # behaviour on its own.
  dumpImage: postgres:16-alpine
  uploadImage: amazon/aws-cli:2.17.0
  # Tiers are pruned independently, oldest first.
  retention:
    daily: 7
    weekly: 4
    monthly: 6
  s3:
    bucket: ""
    prefix: librarius
    region: us-east-1
    # Empty for AWS S3 itself. Any S3-compatible provider needs its endpoint
    # here, e.g. https://s3.fr-par.scw.cloud or https://s3.eu-central-003.backblazeb2.com
    endpoint: ""
  # Secret carrying the bucket credentials and the encryption passphrase.
  # Created by hand like the two above, never by the chart.
  existingSecret: ""
  secretKeys:
    accessKeyId: access-key-id
    secretAccessKey: secret-access-key
    passphrase: encryption-passphrase
  # Scratch space for the dump and its encrypted copy, on the node's disk.
  # Comfortably above twice the compressed dump; raise it as the data grows.
  workDirSize: 1Gi
  # Modest on purpose: the node is CPU-constrained and this pod exists for a
  # couple of minutes a day.
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 300m, memory: 256Mi }
