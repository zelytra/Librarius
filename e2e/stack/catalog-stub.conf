# Deterministic stand-in for the two third-party catalogs the API queries.
#
# The journey under test is "search, then add to the collection": what matters is that
# the browser, the API and the database agree, not that Open Library is up. Both
# providers swallow their own failures and return an empty list, so a flaky third party
# would turn into an empty result set and a puzzling test failure.
#
# The answers are fixed, whatever the query. No cover URL is served on purpose: the
# collection tiles only render the title when there is no cover image, which is what the
# assertions look for.
server {
    listen 80;
    default_type application/json;

    # Open Library — GET /search.json?q=…&limit=…&fields=…
    location = /search.json {
        return 200 '{"docs":[{"title":"Dune","author_name":["Frank Herbert"],"first_publish_year":1965,"isbn":["9780441013593"],"publisher":["Chilton Books"],"language":["eng"]},{"title":"Fondation","author_name":["Isaac Asimov"],"first_publish_year":1951,"isbn":["9782070360536"],"publisher":["Gallimard"],"language":["fre"]}]}';
    }

    # AniList — POST / with a GraphQL body (search and upcoming releases alike).
    location = / {
        return 200 '{"data":{"Page":{"media":[{"id":1,"title":{"romaji":"Vinland Saga","english":"Vinland Saga"},"startDate":{"year":2030,"month":1,"day":1},"coverImage":null,"description":"Fixture manga.","staff":{"edges":[{"role":"Story & Art","node":{"name":{"full":"Makoto Yukimura"}}}]}}]}}}';
    }

    location / {
        return 404 '{"error":"unexpected catalog path"}';
    }
}
