# Deterministic stand-in for the three third-party catalogs the API queries.
#
# The journey under test is "search, then add to the collection": what matters is that
# the browser, the API and the database agree, not that Open Library is up. Every
# provider swallows its own failures and returns an empty list, so a flaky third party
# would turn into an empty result set and a puzzling test failure.
#
# **Every** catalog the API can call has to be answered here, not just the ones a journey
# is about. Leaving one pointed at the real internet is not a harmless extra source: two
# book providers share one result limit, so a live catalogue answering a full page of its
# own editions pushes the fixtures below out of the response entirely, and the journeys
# fail looking for a title that was merely crowded out.
#
# The answers are fixed, whatever the query. No cover URL is served on purpose: the
# collection tiles only render the title when there is no cover image, which is what the
# assertions look for.
#
# Open Library and the BnF deliberately describe the *same two books*, in their own
# shapes: the aggregation merges them on title+author, so the journeys see two results
# whichever provider CDI happens to call first — and the merge itself gets exercised.
server {
    listen 80;
    default_type application/json;

    # Open Library — GET /search.json?q=…&limit=…&fields=…
    location = /search.json {
        return 200 '{"docs":[{"title":"Dune","author_name":["Frank Herbert"],"first_publish_year":1965,"isbn":["9780441013593"],"publisher":["Chilton Books"],"language":["eng"]},{"title":"Fondation","author_name":["Isaac Asimov"],"first_publish_year":1951,"isbn":["9782070360536"],"publisher":["Gallimard"],"language":["fre"]}]}';
    }

    # BnF — GET /SRU?version=…&operation=…&query=…&recordSchema=…&maximumRecords=…
    # The same two books as Open Library above, as SRU Dublin Core: an authority heading
    # for the creator, so the provider's rewrite into reading order is what makes the two
    # sides merge instead of doubling every result.
    location = /SRU {
        default_type application/xml;
        return 200 '<srw:searchRetrieveResponse xmlns:srw="http://www.loc.gov/zing/srw/"><srw:numberOfRecords>2</srw:numberOfRecords><srw:records><srw:record><srw:recordData><dc xmlns="http://purl.org/dc/elements/1.1/"><title>Dune</title><creator>Herbert, Frank (1920-1986). Auteur du texte</creator><date>1965</date><publisher>Chilton Books</publisher><language>eng</language><identifier>http://catalogue.bnf.fr/ark:/12148/cb11934534t</identifier><identifier>978-0-441-01359-3 (br.)</identifier></dc></srw:recordData></srw:record><srw:record><srw:recordData><dc xmlns="http://purl.org/dc/elements/1.1/"><title>Fondation</title><creator>Asimov, Isaac (1920-1992). Auteur du texte</creator><date>DL 1951</date><publisher>Gallimard</publisher><language>fre</language><identifier>http://catalogue.bnf.fr/ark:/12148/cb11889227g</identifier><identifier>978-2-07-036053-6 (br.)</identifier></dc></srw:recordData></srw:record></srw:records></srw:searchRetrieveResponse>';
    }

    # AniList — POST / with a GraphQL body (search and upcoming releases alike).
    location = / {
        return 200 '{"data":{"Page":{"media":[{"id":1,"title":{"romaji":"Vinland Saga","english":"Vinland Saga"},"startDate":{"year":2030,"month":1,"day":1},"coverImage":null,"description":"Fixture manga.","staff":{"edges":[{"role":"Story & Art","node":{"name":{"full":"Makoto Yukimura"}}}]}}]}}}';
    }

    location / {
        return 404 '{"error":"unexpected catalog path"}';
    }
}
