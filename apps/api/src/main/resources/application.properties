# ── Librarius API — configuration ─────────────────────────────────────────────
quarkus.application.name=librarius-api
quarkus.http.port=8080

# CORS. The deployed setup is same-origin — one host, the ingress routing /api to the API
# and / to the PWA — which is easy to read as "CORS does not apply here". It does: browsers
# send an Origin header on POST, PUT and DELETE even same-origin, so an allow-list holding
# only the Vite dev server rejects every write with a 403 once deployed.
#
# The allowed origin is therefore configurable, and defaults to the dev server so a local
# run needs no extra setup.
#
# The switch is `quarkus.http.cors.enabled` since Quarkus 3.37: the bare `quarkus.http.cors`
# spelling is no longer recognised and is ignored with a build warning, which would leave
# CORS switched off and bring the 403 on writes straight back.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Health exposed under /q/health (Quarkus default)
quarkus.smallrye-health.root-path=/q/health

# ── OpenAPI ───────────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.info-title=Librarius API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de Ma Bibliothèque (Librarius)
# Writes openapi.json/.yaml at build time (consumed by orval for the TS client).
quarkus.smallrye-openapi.store-schema-directory=../../openapi
# Swagger UI is left to its default: served in dev and test, absent from the production
# build. Publishing an interactive console of every endpoint hands an attacker a map of
# the API for no benefit — the schema is in the repository for whoever needs it.

# ── Persistence ───────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
# Flyway owns the schema; Hibernate only validates it.
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true

# In test only: lets StatsAggregationTest assert that the statistics endpoint issues a
# fixed number of queries whatever the size of the collection.
%test.quarkus.hibernate-orm.statistics=true

# Dev: connects to the docker-compose PostgreSQL (persistent data).
%dev.quarkus.datasource.username=librarius
%dev.quarkus.datasource.password=librarius
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/librarius
# In test no URL is provided: Quarkus Dev Services starts an ephemeral PostgreSQL.

# ── Auth (OIDC / Keycloak) ────────────────────────────────────────────────────
# In dev and test, Quarkus Dev Services starts Keycloak and configures
# auth-server-url automatically. In prod, supply the environment variables.
quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/librarius}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:librarius-api}

# In dev the API validates tokens issued by the docker-compose Keycloak
# (fixed port 8081, imported realm). Run `pnpm infra:up` beforehand.
%dev.quarkus.oidc.auth-server-url=http://localhost:8081/realms/librarius

# In test (no URL above), Quarkus Dev Services starts an ephemeral Keycloak
# with two users alice/bob for the integration tests.
%test.quarkus.keycloak.devservices.realm-name=librarius
%test.quarkus.keycloak.devservices.users.alice=alice
%test.quarkus.keycloak.devservices.users.bob=bob
%test.quarkus.keycloak.devservices.roles.alice=user
%test.quarkus.keycloak.devservices.roles.bob=user

# ── External catalog ──────────────────────────────────────────────────────────
quarkus.rest-client.anilist.url=https://graphql.anilist.co
quarkus.rest-client.openlibrary.url=https://openlibrary.org
# A miss holds a database transaction while it waits for the provider, so that concurrent
# pods do not all fetch the same cold entry. Bounded timeouts keep that window short: an
# unresponsive provider degrades into an empty result, never into a stuck connection.
quarkus.rest-client.anilist.connect-timeout=3000
quarkus.rest-client.anilist.read-timeout=8000
quarkus.rest-client.openlibrary.connect-timeout=3000
quarkus.rest-client.openlibrary.read-timeout=8000
# `read-timeout` is not the ceiling it looks like. Vert.x restarts that timer every time a
# chunk arrives, so it bounds silence, not slowness: a provider trickling one byte every
# seven seconds keeps the call — and the connection the cold fetch is holding — alive for as
# long as it likes. This is the absolute deadline, applied by the providers themselves. Above
# 3 s connect + 8 s idle so an ordinary slow answer is still allowed to arrive.
librarius.catalog.provider.call-timeout=12S

# ── Catalog cache ─────────────────────────────────────────────────────────────
# Two levels. Caffeine answers in microseconds but dies with the pod, and a deployment on
# every merge to `main` used to empty it several times a day; the `catalog_cache` table
# behind it keeps the payload across restarts so a fresh pod does not re-spend the shared
# Open Library and AniList quotas.
quarkus.cache.caffeine."catalog-search".expire-after-write=6H
quarkus.cache.caffeine."catalog-search".maximum-size=500
quarkus.cache.caffeine."catalog-upcoming".expire-after-write=12H
quarkus.cache.caffeine."catalog-upcoming".maximum-size=50
# Time-to-live of the persistent level, kept in step with the Caffeine values above.
librarius.catalog.cache.search.ttl=6H
librarius.catalog.cache.upcoming.ttl=12H
# Expired rows are already invisible to reads; the purge only reclaims the space, so it can
# run rarely and off the request path.
librarius.catalog.cache.purge.every=1h
# A cold miss holds one database connection while the provider is on the line — that is what
# makes the advisory lock worth anything, and it cannot be avoided: a PostgreSQL lock dies
# with its transaction, and a transaction with its connection. What is bounded is how many
# cold misses may do it at once. Four out of the twenty connections Agroal pools by default,
# so sixteen always remain for the rest of the API however many cold searches arrive.
# Raising this raises the share of the pool catalog searches can occupy.
librarius.catalog.cache.fetch.concurrency=4
# How long a cold miss waits for a permit before going out to the provider unlocked. Past
# that point a duplicated outbound call is the cheaper failure.
librarius.catalog.cache.fetch.queue-timeout=2S

# ── Catalog quota ─────────────────────────────────────────────────────────────
# Catalog searches consume the instance's Open Library and AniList quotas, which are
# shared by every user: without a ceiling, one caller in a loop breaks search for all.
# Sign-up is open, so holding a token is not a sign of trust.
librarius.catalog.rate-limit.per-minute=30
librarius.catalog.rate-limit.per-day=500
