# ── Librarius API — configuration ─────────────────────────────────────────────
quarkus.application.name=librarius-api
quarkus.http.port=8080

# CORS. The deployed setup is same-origin — one host, the ingress routing /api to the API
# and / to the PWA — which is easy to read as "CORS does not apply here". It does: browsers
# send an Origin header on POST, PUT and DELETE even same-origin, so an allow-list holding
# only the Vite dev server rejects every write with a 403 once deployed.
#
# The allowed origin is therefore configurable, and defaults to the dev server so a local
# run needs no extra setup.
#
# The switch is `quarkus.http.cors.enabled` since Quarkus 3.37: the bare `quarkus.http.cors`
# spelling is no longer recognised and is ignored with a build warning, which would leave
# CORS switched off and bring the 403 on writes straight back.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Health exposed under /q/health (Quarkus default)
quarkus.smallrye-health.root-path=/q/health

# ── OpenAPI ───────────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.info-title=Librarius API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de Ma Bibliothèque (Librarius)
# Writes openapi.json/.yaml at build time (consumed by orval for the TS client).
quarkus.smallrye-openapi.store-schema-directory=../../openapi
# Swagger UI is left to its default: served in dev and test, absent from the production
# build. Publishing an interactive console of every endpoint hands an attacker a map of
# the API for no benefit — the schema is in the repository for whoever needs it.

# ── Persistence ───────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
# Flyway owns the schema; Hibernate only validates it.
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
# Declared rather than left implicit: 50 is the Agroal default, so this line changes
# nothing today — it makes the number a decision instead of an accident, because it is the
# one that bounds how many requests can be in flight at once, and the catalog cache reasons
# about it out loud (see `librarius.catalog.cache.fetch.concurrency` below).
# The ceiling above it is PostgreSQL's own `max_connections`, at its default of 100 and
# shared with Keycloak: raising this without raising that trades one exhaustion for another.
quarkus.datasource.jdbc.max-size=50
# ⚠️ There is no metric on this pool. /q/metrics carries JVM, Netty and worker-pool figures
# and nothing about the connection pool — the resource that runs out first. Setting
# `quarkus.datasource.jdbc.metrics.enabled=true` is not enough on its own: quarkus-micrometer
# ships no datasource binder, so the `agroal_*` gauges never reach Prometheus. Until that is
# wired up, pool exhaustion is only visible once it becomes 5xx, through
# `LibrariusApiHighErrorRate`. See https://github.com/zelytra/Librarius/issues/132.

# In test only: lets StatsAggregationTest assert that the statistics endpoint issues a
# fixed number of queries whatever the size of the collection.
%test.quarkus.hibernate-orm.statistics=true

# Dev: connects to the docker-compose PostgreSQL (persistent data).
%dev.quarkus.datasource.username=librarius
%dev.quarkus.datasource.password=librarius
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/librarius
# In test no URL is provided: Quarkus Dev Services starts an ephemeral PostgreSQL.

# ── Auth (OIDC / Keycloak) ────────────────────────────────────────────────────
# In dev and test, Quarkus Dev Services starts Keycloak and configures
# auth-server-url automatically. In prod, supply the environment variables.
quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/librarius}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:librarius-api}

# In dev the API validates tokens issued by the docker-compose Keycloak
# (fixed port 8081, imported realm). Run `pnpm infra:up` beforehand.
%dev.quarkus.oidc.auth-server-url=http://localhost:8081/realms/librarius

# In test (no URL above), Quarkus Dev Services starts an ephemeral Keycloak
# with three users for the integration tests: alice and bob, who are the two sides of
# every isolation check, and carol, who exists only so that AccountDeletionTest can delete
# an account outright. The suite shares one database, so the test that erases everything a
# user owns needs a user no other test is building on.
%test.quarkus.keycloak.devservices.realm-name=librarius
%test.quarkus.keycloak.devservices.users.alice=alice
%test.quarkus.keycloak.devservices.users.bob=bob
%test.quarkus.keycloak.devservices.users.carol=carol
%test.quarkus.keycloak.devservices.roles.alice=user
%test.quarkus.keycloak.devservices.roles.bob=user
%test.quarkus.keycloak.devservices.roles.carol=user

# ── Account deletion (GDPR art. 17) ───────────────────────────────────────────
# Deleting an account means deleting the Keycloak login too, which needs a service
# account this repository deliberately does not ship: a credential committed here is a
# credential published. It is therefore OFF by default, and an instance that has not been
# configured answers 503 to DELETE /api/me and erases nothing — never the reverse, which
# would leave a working login in front of a library that no longer exists.
# What to create, and how: docs/DEPLOYMENT.md § "Account deletion".
librarius.keycloak.admin.enabled=${KEYCLOAK_ADMIN_ENABLED:false}
# Base URL without the realm, e.g. http://librarius-keycloak:8081/auth
librarius.keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:}
librarius.keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:librarius}
librarius.keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:}
librarius.keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# ── Export (GDPR art. 20) ─────────────────────────────────────────────────────
# Above this many titles — collection plus wishlist — the export is built on a small pool
# of its own and downloaded from a second call, so that a very large account cannot hold
# an HTTP worker or time out behind the ingress. A normal library is far below it and is
# served straight away.
librarius.export.async-threshold=2000

# ── External catalog ──────────────────────────────────────────────────────────
quarkus.rest-client.anilist.url=https://graphql.anilist.co
quarkus.rest-client.openlibrary.url=https://openlibrary.org
# Second book source, next to Open Library. Open without registration, quota or key, so
# there is no credential to supply here and none to leak — see BnfProvider for why the BnF
# rather than another catalogue.
quarkus.rest-client.bnf.url=https://catalogue.bnf.fr/api
# A miss holds a database connection while it waits for the provider, so that concurrent pods
# do not all fetch the same cold entry. These two bound the common failures: 3 s to get a
# connection at all, and 8 s of complete silence once one is open.
quarkus.rest-client.anilist.connect-timeout=3000
quarkus.rest-client.anilist.read-timeout=8000
quarkus.rest-client.openlibrary.connect-timeout=3000
quarkus.rest-client.openlibrary.read-timeout=8000
quarkus.rest-client.bnf.connect-timeout=3000
quarkus.rest-client.bnf.read-timeout=8000
# `read-timeout` is not the ceiling it looks like. Vert.x restarts that timer every time a
# chunk arrives, so it bounds silence, not slowness: a provider trickling one byte every
# seven seconds keeps the call — and the connection the cold fetch is holding — alive for as
# long as it likes. This is the absolute deadline, applied by the providers themselves. Above
# 3 s connect + 8 s idle so an ordinary slow answer is still allowed to arrive.
librarius.catalog.provider.call-timeout=12S

# ── Catalog cache ─────────────────────────────────────────────────────────────
# Two levels. Caffeine answers in microseconds but dies with the pod, and a deployment on
# every merge to `main` used to empty it several times a day; the `catalog_cache` table
# behind it keeps the payload across restarts so a fresh pod does not re-spend the shared
# Open Library and AniList quotas.
quarkus.cache.caffeine."catalog-search".expire-after-write=6H
quarkus.cache.caffeine."catalog-search".maximum-size=500
quarkus.cache.caffeine."catalog-upcoming".expire-after-write=12H
quarkus.cache.caffeine."catalog-upcoming".maximum-size=50
# The editions of a work, gathered when its detail screen is opened. Twelve hours like the
# upcoming releases: a work rarely gains a printing, and the point is to spare the provider.
quarkus.cache.caffeine."catalog-editions".expire-after-write=12H
quarkus.cache.caffeine."catalog-editions".maximum-size=200
# Time-to-live of the persistent level, kept in step with the Caffeine values above.
librarius.catalog.cache.search.ttl=6H
librarius.catalog.cache.upcoming.ttl=12H
librarius.catalog.cache.editions.ttl=12H
# Expired rows are already invisible to reads; the purge only reclaims the space, so it can
# run rarely and off the request path.
librarius.catalog.cache.purge.every=1h
# A cold miss holds one database connection while the provider is on the line — that is what
# makes the advisory lock worth anything, and it cannot be avoided: a PostgreSQL lock dies
# with its transaction, and a transaction with its connection. What is bounded is how many
# cold misses may do it at once. Four out of the fifty above, so forty-six always remain for
# the rest of the API however many cold searches arrive.
# Raising this raises the share of the pool catalog searches can occupy.
librarius.catalog.cache.fetch.concurrency=4
# How long a cold miss waits for a permit before going out to the provider unlocked. Past
# that point a duplicated outbound call is the cheaper failure.
librarius.catalog.cache.fetch.queue-timeout=2S

# ── Upcoming releases ─────────────────────────────────────────────────────────
# `upcoming_release` is filled in the background, never on a request: displaying "what is
# coming" must cost a query rather than a provider call. Once a day is plenty — a release
# date moves by weeks, not by hours — and the run goes through the same 12 h catalog cache
# as everything else, so several pods refreshing on the same day spend one provider call.
librarius.releases.refresh.every=24h
# Not on the first second of a boot: a deployment restarts every pod at once, and the
# refresh has no reason to compete with the traffic coming back.
librarius.releases.refresh.delayed=2m
# In test the scheduler stays off: the suite must not reach out to AniList or Open Library,
# and the feed is exercised by calling the refresher directly.
%test.librarius.releases.refresh.every=off

# ── Series volume totals ──────────────────────────────────────────────────────
# `series.total_volumes` is filled in the background from the providers (AniList reports a
# manga's volume count), so the series grid can show the tomes nobody owns yet. Once a day,
# like the releases refresh, and off in the test profile — the suite calls the refresher
# directly with the provider mocked.
librarius.series.volume-refresh.every=24h
librarius.series.volume-refresh.delayed=3m
%test.librarius.series.volume-refresh.every=off

# ── Author bibliography ───────────────────────────────────────────────────────
# The author page enriches its bibliography with the works a provider credits to the author
# (AniList lists a manga author's works), cached so repeat views cost nothing. Off in the test
# profile, so the author suite never reaches out to AniList; the routing is exercised directly.
librarius.author.enrich-bibliography=true
%test.librarius.author.enrich-bibliography=false

# ── Imported page counts ──────────────────────────────────────────────────────
# A scrape brings no page count (Booknode's table has none), so imported titles read "—" for
# their length. This fills it in the background from the catalog, a batch at a time so one run
# cannot spend the provider quota. Off in the test profile — the suite calls the enricher
# directly with the provider mocked.
librarius.imports.enrich.every=15m
librarius.imports.enrich.delayed=5m
%test.librarius.imports.enrich.every=off

# ── Trust flag ────────────────────────────────────────────────────────────────
# `app_user.trusted` is computed off the request path (#180), never set by a user. A single
# evaluator promotes the accounts that meet the criteria; the thresholds live here so the open
# question of what "trustworthy" means is retuned without touching an endpoint or the schema.
librarius.trust.min-account-months=3
librarius.trust.min-read-titles=10
# Revocation (#195): an account carrying this many upheld reports against its contributions over
# the trailing window loses the flag. A provisional "too many" the maintainer retunes -- and only
# UPHELD reports count, which nothing writes until a moderation surface exists, so this is dormant
# in production for now (grant behaves exactly as #180 shipped it).
librarius.trust.max-upheld-reports=3
librarius.trust.report-window-days=180
# Once a day is plenty: tenure and the read count move by days, not by minutes.
librarius.trust.evaluate.every=24h
# Not on the first second of a boot, for the reason the releases refresh gives above.
librarius.trust.evaluate.delayed=5m
# In test the scheduler stays off: the evaluation is exercised by calling evaluateAll directly.
%test.librarius.trust.evaluate.every=off
# And with lower thresholds so a fixture need not seed months of tenure and a shelf of reads.
%test.librarius.trust.min-account-months=1
%test.librarius.trust.min-read-titles=2
# Two upheld reports revoke in test, so a fixture crosses the bar with a small, readable run.
%test.librarius.trust.max-upheld-reports=2

# ── Catalog quota ─────────────────────────────────────────────────────────────
# Catalog searches consume the instance's Open Library and AniList quotas, which are
# shared by every user: without a ceiling, one caller in a loop breaks search for all.
# Sign-up is open, so holding a token is not a sign of trust.
librarius.catalog.rate-limit.per-minute=30
librarius.catalog.rate-limit.per-day=500
