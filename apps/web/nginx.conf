server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx ships with gzip off and nothing in front of it compresses — neither the
    # Traefik ingress on the cluster nor the compose stack. Staging was therefore
    # handing phones the raw 473 kB entry chunk instead of the 133 kB gzipped one, on
    # every first visit. Everything below is text, so it all compresses.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Everything under /assets/ carries a content hash in its name, so it can never go
    # stale: a new build produces new names. `=404` rather than the SPA fallback — a
    # missing chunk must fail as a missing chunk, not as an HTML page the browser then
    # tries to parse as JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The shell and the service worker are the two files that decide when a new version
    # is picked up: served from a stale cache, they pin the user to the old build.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # SPA: every unknown route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to the API (the "api" service of the production compose stack).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /q (health, metrics) is not proxied on purpose: nothing in the browser calls it,
    # and Prometheus reaches the api container directly over the compose network.

}
