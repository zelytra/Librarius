server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unknown route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to the API (the "api" service of the production compose stack).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /q (health, metrics) is not proxied on purpose: nothing in the browser calls it,
    # and Prometheus reaches the api container directly over the compose network.

}
