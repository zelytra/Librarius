# Security headers of every response the web app serves (#580). Included by both server
# blocks — this image's nginx.conf and the one the Helm chart mounts over it — at server level
# and again in each location that adds a header of its own, since nginx drops the inherited
# add_header there.
#
# script-src is the app's own origin only: no inline script (the theme boot is a file,
# public/theme-boot.js), 'wasm-unsafe-eval' for the barcode decoder (#440). style-src allows
# inline styles because React writes `style` attributes. Images come from any HTTPS catalogue,
# and the service worker caches them by fetching, hence connect-src https:.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
