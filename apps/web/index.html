<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9aab92" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <title>Ma Bibliothèque</title>
    <script>
      // Applies the stored theme before the first paint. A React effect runs after
      // it, so the light palette would flash on every load — and the stylesheet is
      // not parsed yet either, hence the inline background on the root element.
      // Mirrors src/shared/theme/themes.ts; the background colours are the --bg of
      // each palette in src/shared/styles/tokens.css.
      (function () {
        var BACKGROUNDS = {
          creme: '#f3ede3',
          sauge: '#dfe6da',
          rose: '#f1e2df',
          nuit: '#211e1a',
        };
        var stored = null;
        try {
          stored = localStorage.getItem('librarius.theme');
        } catch (e) {
          /* storage unavailable: fall back to the system preference */
        }
        var prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        // Anything else — "systeme", nothing stored, a stale value — follows the system.
        var palette = BACKGROUNDS[stored] ? stored : prefersDark ? 'nuit' : 'creme';

        var root = document.documentElement;
        root.setAttribute('data-theme', palette);
        root.style.backgroundColor = BACKGROUNDS[palette];
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', BACKGROUNDS[palette]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
