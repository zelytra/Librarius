# gitleaks configuration, used by .github/workflows/secrets.yml.
# Scope: the working tree, not the git history (see the workflow for why).

[extend]
useDefault = true

# The leak of issue #58 was a plain `password: <value>` in a chart, not an API
# key: the default rules would not have caught it.
[[rules]]
id = "hardcoded-password-assignment"
description = "Password assigned literally in a configuration file"
# Anchored on a key at the start of a line (YAML, .properties, .env, compose):
# prose mentioning a password, and values read from a variable or a Helm
# template, are not assignments and must not be reported.
regex = '''(?im)^[ \t-]*[a-z0-9_.-]*(?:password|passwd|pwd)[ \t]*[:=][ \t]*["']?[a-z0-9._@!%*+/-]{3,}'''
tags = ["password", "config"]

# Scoped to this rule alone, so every default rule — API keys, tokens, private
# keys — still applies to these files. Keycloak names two of its login messages
# `showPassword` and `hidePassword`, and a message bundle assigns a translation
# to a key with `=`. `showPassword=Afficher le mot de passe` is therefore a
# password assignment as far as the regex above can tell, and is in fact the
# accessible name of the eye button on the sign-in form. A bundle holds interface
# copy; there is no value here for a credential to be.
[rules.allowlist]
description = "Login theme message bundles — translated copy, not credentials"
paths = ['''infra/helm/librarius/files/keycloak-theme/login/messages/.*\.properties''']

[allowlist]
description = """
Local development fixtures. These credentials only ever reach a container bound
to localhost, they are documented as such in CLAUDE.md, and the API declares the
same ones under its %dev profile. Deployed environments read their credentials
from Kubernetes Secrets or from an unversioned .env file.
"""
paths = [
  '''infra/docker-compose\.yml''',
  '''infra/keycloak/realm-librarius\.json''',
  '''apps/api/src/main/resources/application\.properties''',
  '''apps/web/src/test/.*''',
  # The end-to-end suite: a stack created and destroyed by the test run, on localhost,
  # carrying the same throwaway credentials as the dev compose file above. Its only
  # accounts are the demo users already published in the versioned Keycloak realm.
  # Scanning it produces nothing but noise — including on `password: user.password`,
  # which is a variable reference, not a secret.
  '''e2e/.*''',
  '''pnpm-lock\.yaml''',
  '''\.gitleaks\.toml''',
]
