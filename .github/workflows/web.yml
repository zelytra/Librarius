name: web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.github/workflows/web.yml'

# A newer push on the same ref supersedes the run in progress.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # Single source of truth for the Node version, shared with local setups.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @librarius/web lint

      # Explicit: `build` also runs tsc, but a type error must be reported as
      # such rather than buried in a build failure.
      - name: Type check
        run: pnpm --filter @librarius/web typecheck

      - name: Test
        run: pnpm --filter @librarius/web test

      - name: Build
        run: pnpm --filter @librarius/web build
