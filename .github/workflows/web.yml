name: web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.github/workflows/web.yml'

# A newer push on the same ref supersedes the run in progress.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # Single source of truth for the Node version, shared with local setups.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @librarius/web lint

      # Explicit: `build` also runs tsc, but a type error must be reported as
      # such rather than buried in a build failure.
      - name: Type check
        run: pnpm --filter @librarius/web typecheck

      - name: Test
        run: pnpm --filter @librarius/web test

      - name: Build
        run: pnpm --filter @librarius/web build
