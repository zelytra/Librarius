name: web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.github/workflows/web.yml'

# A newer push on the same ref supersedes the run in progress.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # Single source of truth for the Node version, shared with local setups.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @librarius/web lint

      # Explicit: `build` also runs tsc, but a type error must be reported as
      # such rather than buried in a build failure.
      - name: Type check
        run: pnpm --filter @librarius/web typecheck

      - name: Test
        run: pnpm --filter @librarius/web test

      - name: Build
        run: pnpm --filter @librarius/web build

      # The app is read on a phone, often on a bookshop's network: the size of the
      # first payload is a feature. Budgets and the reasoning behind each figure live
      # in the script; it prints every chunk and names the one that blew its budget.
      - name: Bundle budget
        run: node apps/web/scripts/check-bundle-size.mjs

      # Handed to the lighthouse job so it audits this exact build instead of
      # reinstalling and rebuilding its own.
      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: apps/web/dist

      # Version pinned rather than floating, so a local run and CI audit with the same
      # Lighthouse. Same idea as markdownlint-cli2 in the docs workflow. Configuration,
      # thresholds and their justification: apps/web/lighthouserc.json.
      - name: Lighthouse
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.15.1 autorun

      # Kept even when the run is green: the scores of the previous merge are what a
      # later regression gets compared against.
      - name: Publish the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci
          retention-days: 7
          if-no-files-found: ignore
