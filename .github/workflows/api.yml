name: api

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'

# A newer push on the same ref supersedes the run in progress.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build · test (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Dev Services starts throwaway PostgreSQL and Keycloak containers, so the
      # runner's Docker daemon is a hard requirement for this job.
      - name: Build & test
        working-directory: apps/api
        run: ./mvnw -B -ntp verify

      # Surefire reports make a failing run readable without replaying it locally.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-surefire-reports
          path: apps/api/target/surefire-reports/
          retention-days: 7
