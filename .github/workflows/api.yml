name: api

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'

# A newer push on the same ref supersedes the run in progress.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build · test (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Dev Services starts throwaway PostgreSQL and Keycloak containers, so the
      # runner's Docker daemon is a hard requirement for this job.
      - name: Build & test
        working-directory: apps/api
        run: ./mvnw -B -ntp verify

      # Surefire reports make a failing run readable without replaying it locally.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-surefire-reports
          path: apps/api/target/surefire-reports/
          retention-days: 7
