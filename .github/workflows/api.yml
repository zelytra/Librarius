name: api

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'

# A newer push on the same ref supersedes the run in progress.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build · test (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Dev Services starts throwaway PostgreSQL and Keycloak containers, so the
      # runner's Docker daemon is a hard requirement for this job.
      - name: Build & test
        working-directory: apps/api
        run: ./mvnw -B -ntp verify

      # Surefire reports make a failing run readable without replaying it locally.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-surefire-reports
          path: apps/api/target/surefire-reports/
          retention-days: 7
