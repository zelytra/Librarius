name: openapi-sync

# Guarantees that the committed OpenAPI schema and the generated TypeScript client
# match the API code. Fails when `pnpm gen:api` would produce a diff.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'openapi/**'
      - 'apps/web/orval.config.ts'
      - 'apps/web/src/api/**'
      - '.github/workflows/openapi-sync.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'openapi/**'
      - 'apps/web/orval.config.ts'
      - 'apps/web/src/api/**'
      - '.github/workflows/openapi-sync.yml'

# A newer push on the same ref supersedes the run in progress.
concurrency:
  group: openapi-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: schema & client up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Regenerate OpenAPI schema from the API
        working-directory: apps/api
        run: ./mvnw -q -B -ntp -DskipTests package

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate TypeScript client
        run: pnpm --filter @librarius/web gen:api

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- openapi apps/web/src/api/generated; then
            echo "::error::The OpenAPI schema or the TypeScript client is stale. Run 'pnpm --filter @librarius/web gen:api' after building the API, then commit the result."
            exit 1
          fi
