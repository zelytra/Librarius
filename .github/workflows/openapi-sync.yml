name: openapi-sync

# Guarantees that the committed OpenAPI schema and the generated TypeScript client
# match the API code. Fails when `pnpm gen:api` would produce a diff.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'openapi/**'
      - 'apps/web/orval.config.ts'
      - 'apps/web/src/api/**'
      - '.github/workflows/openapi-sync.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'openapi/**'
      - 'apps/web/orval.config.ts'
      - 'apps/web/src/api/**'
      - '.github/workflows/openapi-sync.yml'

# A newer push on the same ref supersedes the run in progress.
concurrency:
  group: openapi-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: schema & client up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Regenerate OpenAPI schema from the API
        working-directory: apps/api
        run: ./mvnw -q -B -ntp -DskipTests package

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate TypeScript client
        run: pnpm --filter @librarius/web gen:api

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- openapi apps/web/src/api/generated; then
            echo "::error::The OpenAPI schema or the TypeScript client is stale. Run 'pnpm --filter @librarius/web gen:api' after building the API, then commit the result."
            exit 1
          fi
