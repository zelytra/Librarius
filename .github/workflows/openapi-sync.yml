name: openapi-sync

# Guarantees that the committed OpenAPI schema and the generated TypeScript client
# match the API code. Fails when `pnpm gen:api` would produce a diff.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'openapi/**'
      - 'apps/web/orval.config.ts'
      - 'apps/web/src/api/**'
      - '.github/workflows/openapi-sync.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'openapi/**'
      - 'apps/web/orval.config.ts'
      - 'apps/web/src/api/**'
      - '.github/workflows/openapi-sync.yml'

# A newer push on the same ref supersedes the run in progress.
concurrency:
  group: openapi-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: schema & client up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Regenerate OpenAPI schema from the API
        working-directory: apps/api
        run: ./mvnw -q -B -ntp -DskipTests package

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate TypeScript client
        run: pnpm --filter @librarius/web gen:api

      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- openapi apps/web/src/api/generated; then
            echo "::error::The OpenAPI schema or the TypeScript client is stale. Run 'pnpm --filter @librarius/web gen:api' after building the API, then commit the result."
            exit 1
          fi
