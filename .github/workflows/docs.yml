name: docs

# The web, api and openapi-sync workflows are filtered on apps/**, so a docs-only
# pull request would trigger no check at all. This workflow fills that gap.
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/docs.yml'

# A newer push on the same ref supersedes the run in progress.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: markdown · links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Document structure: headings, lists, tables, code fences.
      # The version is pinned so that CI and a local `npx markdownlint-cli2` apply
      # exactly the same rule set. Configuration: .markdownlint-cli2.jsonc at the root.
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.2

      # Internal links only (--offline): checks that the documentation does not
      # point at a renamed or deleted file, without depending on third-party sites
      # being up or getting rate-limited by GitHub.
      - name: internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments '**/*.md'
          fail: true
