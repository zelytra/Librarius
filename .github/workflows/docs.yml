name: docs

# Les workflows web/api/openapi-sync sont filtrés sur apps/** : une PR purement
# documentaire ne déclenche donc aucun contrôle. Ce workflow comble ce trou.
on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/docs.yml'

jobs:
  lint:
    name: markdown · liens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Structure des documents : titres, listes, tableaux, blocs de code.
      # Version épinglée pour que la CI et `npx markdownlint-cli2` en local
      # appliquent exactement le même jeu de règles.
      # Configuration : .markdownlint-cli2.jsonc à la racine.
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.2

      # Liens internes uniquement (--offline) : on vérifie que la documentation
      # ne pointe pas vers un fichier renommé ou supprimé, sans dépendre de la
      # disponibilité des sites externes ni se faire limiter par GitHub.
      - name: liens internes
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments '**/*.md'
          fail: true
