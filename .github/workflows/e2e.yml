name: e2e

# Runs the key journeys against the whole stack — PostgreSQL, Keycloak, the API and the
# web app — on every pull request. This is the only job that proves authentication, the
# HTTP routing and the database still work together; unit tests cannot see any of it.
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'e2e/**'
      - 'infra/keycloak/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.github/workflows/e2e.yml'

# A newer push on the same pull request supersedes the run in progress.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  journeys:
    name: key journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `e2e` keeps its own lockfile: it is not a member of the pnpm workspace, see the
      # comment in pnpm-workspace.yaml.
      - name: Install dependencies
        working-directory: e2e
        run: pnpm install --ignore-workspace --frozen-lockfile

      # Playwright transpiles the specs without type-checking them: a type error would
      # only surface as a runtime failure inside a test.
      - name: Type check
        working-directory: e2e
        run: pnpm typecheck

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # The images are built here rather than by `docker compose up` so the layer cache
      # is shared between runs: a cold Maven build alone would blow the time budget.
      # `load: true` puts them in the local daemon under the tags the compose file
      # expects, which then starts them without rebuilding.
      - name: Build the API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/api
          file: apps/api/src/main/docker/Dockerfile.jvm
          push: false
          load: true
          tags: librarius-api:e2e
          cache-from: type=gha,scope=e2e-api
          cache-to: type=gha,mode=max,scope=e2e-api

      - name: Build the web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: librarius-web:e2e
          cache-from: type=gha,scope=e2e-web
          cache-to: type=gha,mode=max,scope=e2e-web

      - name: Install the browser
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      # Brings the stack up, waits for it, runs the journeys, then tears it down — except
      # here, where E2E_KEEP_STACK leaves it up so a failure can be read below. Nothing
      # cleans it up if this job is cancelled mid-run, but the runner itself is destroyed
      # within minutes either way.
      - name: Run the journeys
        working-directory: e2e
        env:
          E2E_KEEP_STACK: '1'
        run: pnpm test

      # global-teardown.ts only skipped for us; the containers are still there. Without
      # this, a startup failure — the API dying before the first request, as opposed to a
      # flaky journey — was undiagnosable from GitHub: globalSetup only dumps the stack
      # when waitForStack() itself times out, and every other failure tore the evidence
      # down before anyone could look at it.
      - name: Dump the stack logs
        if: failure()
        working-directory: e2e
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Stop the stack
        if: always()
        working-directory: e2e
        run: docker compose -f docker-compose.e2e.yml down -v

      - name: Publish the traces and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
