name: e2e

# Runs the key journeys against the whole stack — PostgreSQL, Keycloak, the API and the
# web app — on every pull request. This is the only job that proves authentication, the
# HTTP routing and the database still work together; unit tests cannot see any of it.
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'e2e/**'
      - 'infra/keycloak/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.github/workflows/e2e.yml'

# A newer push on the same pull request supersedes the run in progress.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  journeys:
    name: key journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `e2e` keeps its own lockfile: it is not a member of the pnpm workspace, see the
      # comment in pnpm-workspace.yaml.
      - name: Install dependencies
        working-directory: e2e
        run: pnpm install --ignore-workspace --frozen-lockfile

      # Playwright transpiles the specs without type-checking them: a type error would
      # only surface as a runtime failure inside a test.
      - name: Type check
        working-directory: e2e
        run: pnpm typecheck

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The images are built here rather than by `docker compose up` so the layer cache
      # is shared between runs: a cold Maven build alone would blow the time budget.
      # `load: true` puts them in the local daemon under the tags the compose file
      # expects, which then starts them without rebuilding.
      - name: Build the API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/api
          file: apps/api/src/main/docker/Dockerfile.jvm
          push: false
          load: true
          tags: librarius-api:e2e
          cache-from: type=gha,scope=e2e-api
          cache-to: type=gha,mode=max,scope=e2e-api

      - name: Build the web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: librarius-web:e2e
          cache-from: type=gha,scope=e2e-web
          cache-to: type=gha,mode=max,scope=e2e-web

      - name: Install the browser
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      # Brings the stack up, waits for it, runs the journeys, then tears it down.
      - name: Run the journeys
        working-directory: e2e
        run: pnpm test

      - name: Publish the traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
