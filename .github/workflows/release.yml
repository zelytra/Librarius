name: release

# A `vX.Y.Z` tag on `main` cuts a release: versioned images on GHCR, a changelog built
# from the conventional commits, a packaged chart and a GitHub release.
#
# It deploys nothing. Merging into `main` deploys staging (cd.yml), and production has
# no domain yet (#103). What a tag produces today is the other half of a deployment:
# artefacts you can name, and a documented way back — see docs/DEPLOYMENT.md.
on:
  push:
    tags:
      - 'v*'

# Two releases at once would race on the alignment branch and on GHCR aliases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
      tags: ${{ steps.semver.outputs.tags }}
      range: ${{ steps.history.outputs.range }}
      compare: ${{ steps.history.outputs.compare }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog reads the history back to the previous tag.
          fetch-depth: 0

      # A tag placed on a branch that never reached `main` would publish a version whose
      # content cannot be found again from the released history.
      - name: Check the tag sits on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not contained in main"
            exit 1
          fi

      - name: Map the tag to image tags
        id: semver
        run: bash .github/scripts/release-version.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Locate the previous release
        id: history
        run: |
          # Nearest release tag reachable from the parent: `--match` keeps any other
          # tag that may exist in the repository out of the range.
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            echo "range=${previous}..${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "compare=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # First release: the range is the whole history reachable from the tag.
            echo "range=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "compare=" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: build & push (${{ matrix.name }})
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One broken image should not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
            file: apps/api/src/main/docker/Dockerfile.jvm
          - name: web
            context: .
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is deliberately absent: it tracks the head of `main` (cd.yml, staging)
      # and moving it here would make it mean two different things.
      - name: Compose the image references
        id: refs
        env:
          IMAGE: ghcr.io/zelytra/librarius-${{ matrix.name }}
          TAGS: ${{ needs.version.outputs.tags }}
        run: |
          {
            echo 'list<<IMAGE_REFS'
            for tag in $TAGS; do echo "${IMAGE}:${tag}"; done
            echo IMAGE_REFS
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # The web image bakes both values in at build time (the api ignores them):
          # the public OIDC authority, and the version shown on the Settings screen.
          # The authority is the staging one until production gets a domain (#103).
          build-args: |
            VITE_OIDC_AUTHORITY=https://librarius.zelytra.fr/auth/realms/librarius
            VITE_APP_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.refs.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: changelog, chart & GitHub release
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RANGE: ${{ needs.version.outputs.range }}
      COMPARE: ${{ needs.version.outputs.compare }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Render the release notes
        run: |
          bash .github/scripts/changelog.sh "$VERSION" "$RANGE" "$COMPARE" > release-notes.md
          cat release-notes.md

      - name: Align the chart with the tag
        run: bash .github/scripts/sync-version.sh "$VERSION"

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.0

      # The chart refuses to render without the Secret names; any value does here, the
      # point is to catch a template broken by the version bump before publishing it.
      - name: Lint and package the chart
        run: |
          helm lint infra/helm/librarius \
            --set postgres.existingSecret=lint \
            --set keycloak.existingSecret=lint
          helm package infra/helm/librarius --destination dist

      - name: Create the GitHub release
        run: |
          flags=()
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}" \
            dist/librarius-"$VERSION".tgz

      # The chart version and the changelog belong in the repository, but `main` takes
      # no direct commit (.claude/docs/CONVENTIONS.md): they come back through a pull
      # request like anything else.
      #
      # The branch is cut from the current `main`, not from the tag: `main` may already
      # have moved on, and a branch based on the tag would ask to revert whatever landed
      # in between. The generated files are therefore produced a second time, on top of
      # `main`. `release-notes.md` and `dist/` are untracked and survive the switch.
      - name: Open the alignment pull request
        run: |
          branch="chore/release-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -- .
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git switch -c "$branch" refs/remotes/origin/main

          bash .github/scripts/sync-version.sh "$VERSION"
          awk '
            { print }
            /^<!-- releases:start -->$/ && !inserted {
              print ""
              while ((getline line < "release-notes.md") > 0) print line
              inserted = 1
            }
          ' CHANGELOG.md > CHANGELOG.next
          mv CHANGELOG.next CHANGELOG.md

          if git diff --quiet -- CHANGELOG.md infra/helm/librarius; then
            echo "Nothing to align, main already matches ${GITHUB_REF_NAME}."
            exit 0
          fi

          git add CHANGELOG.md infra/helm/librarius/Chart.yaml infra/helm/librarius/values.yaml
          git commit -m "chore(release): align the chart and changelog with ${GITHUB_REF_NAME}" \
            -m "Written by the release workflow: the chart version, the default image tags and the changelog now say what ${GITHUB_REF_NAME} published."
          git push origin "$branch"

          # Opening pull requests from Actions requires the repository setting
          # "Allow GitHub Actions to create and approve pull requests". Without it the
          # branch is still pushed and the release stands: only the merge is manual.
          if ! gh pr create --base main --head "$branch" \
            --title "chore(release): align the chart and changelog with ${GITHUB_REF_NAME}" \
            --body "Chart version, \`appVersion\`, default image tags and \`CHANGELOG.md\` aligned with the \`${GITHUB_REF_NAME}\` release."; then
            echo "::warning::Could not open the pull request. Branch \`${branch}\` is pushed, open it by hand."
          fi
