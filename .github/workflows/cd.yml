name: cd

# On push to main: build and push the images to GHCR, then deploy the stack to the
# Kubernetes cluster with Helm, using the KUBECONFIG secret.
#
# Target: librarius.zelytra.fr — staging. Production (#103) will be deployed from tags
# once its domain exists; nothing here touches it.
on:
  push:
    branches: [main]

# Never run two deployments at once, and never cancel one midway: an interrupted
# helm upgrade would leave the release in a partial state.
concurrency:
  group: cd
  cancel-in-progress: false

env:
  # Librarius owns its namespace: nothing of it lives in `default` any more, so its
  # resources, quotas and future network policies stand on their own.
  NAMESPACE: librarius

jobs:
  build:
    name: build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            file: apps/api/src/main/docker/Dockerfile.jvm
          - name: web
            context: .
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Staging runs the head of `main`, which carries no version number: the commit is
      # what identifies it. Released images get their X.Y.Z here instead (release.yml).
      - name: Compute the displayed version
        id: appver
        run: echo "value=staging-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # The web image bakes in the public OIDC authority and the displayed version at
          # build time (both ignored by the api).
          build-args: |
            VITE_OIDC_AUTHORITY=https://librarius.zelytra.fr/auth/realms/librarius
            VITE_APP_VERSION=${{ steps.appver.outputs.value }}
          tags: |
            ghcr.io/zelytra/librarius-${{ matrix.name }}:latest
            ghcr.io/zelytra/librarius-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: helm deploy (librarius.zelytra.fr)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both packages are public, so the kubelet pulls them with no credential at
      # all and a pod scheduled long after this run still pulls (#136). That
      # property is load-bearing and invisible from the repository: if a package is
      # ever flipped back to private, every pod fails with ImagePullBackOff, minutes
      # after this run has ended, and the error names authentication rather than
      # visibility. Ask the registry anonymously — the same way the kubelet will —
      # before the cluster is touched at all.
      - name: Check the images are anonymously pullable
        run: |
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'
          for repo in zelytra/librarius-web zelytra/librarius-api; do
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r '.token // empty')
            # Without this, an empty token would come back as a 403 below and be
            # reported as "the package is private", which it would not be.
            if [ -z "$token" ]; then
              echo "::error::ghcr.io handed out no pull token for ${repo}; the registry, not the package, is what is wrong."
              exit 1
            fi
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" \
              "https://ghcr.io/v2/${repo}/manifests/${GITHUB_SHA}")
            if [ "$status" != 200 ]; then
              echo "::error::ghcr.io/${repo}:${GITHUB_SHA} is not anonymously pullable (HTTP ${status})."
              echo "::error::The package is private, or that tag was never pushed. The chart carries no pull secret on purpose — docs/DEPLOYMENT.md § 'Pulling the images'."
              exit 1
            fi
            echo "ghcr.io/${repo}:${GITHUB_SHA} — anonymous pull OK"
          done

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Configure kube access
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Helm would create the namespace itself; creating it up front keeps the
      # kubectl steps below addressable on a cluster that has never run this chart.
      - name: Ensure the namespace exists
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # The two Secrets below are created by hand on the cluster and never by the
      # CI: no credential transits through this repository. Procedure in
      # docs/DEPLOYMENT.md. A missing Secret makes the chart fail to render.
      # The node this deploys to is CPU-saturated at times, and a rollout that is
      # merely slow — not stuck — kept blowing past helm's `--wait` with "context
      # deadline exceeded" (#187), marking a healthy deploy failed and leaving the
      # release pending. So the apply no longer waits: `kubectl rollout status`
      # below is the readiness gate instead — per deployment, with generous room,
      # and it names the one that is stuck when a rollout genuinely does not
      # converge (the Report step adds the pod events).
      - name: Helm upgrade --install
        run: |
          # Recreate for the two JVM pods: this single node has no CPU headroom to
          # surge a second api or keycloak replica, so a RollingUpdate leaves the new
          # pod Pending and the release never converges (issue #187). Stopping the old
          # pod first trades a few seconds of downtime — acceptable on staging, and
          # keycloak sessions now survive it in Postgres — for a rollout that fits.
          helm upgrade --install librarius ./infra/helm/librarius \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set web.image.tag=${{ github.sha }} \
            --set api.image.tag=${{ github.sha }} \
            --set api.strategy=Recreate \
            --set keycloak.strategy=Recreate \
            --set postgres.existingSecret=librarius-postgres \
            --set keycloak.existingSecret=librarius-keycloak

      - name: Verify rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/librarius-web --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/librarius-api --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/librarius-keycloak --timeout=600s
          kubectl -n "$NAMESPACE" get pods,ingress -l release=librarius

      # A failed `--wait` says "timed out waiting for the condition" and nothing
      # else, which is why #125 read as a broken release for nine minutes when the
      # pod was merely unschedulable. The pod state and the namespace events name
      # the actual cause — FailedScheduling, Failed to pull, CrashLoopBackOff.
      - name: Report what the cluster says
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -l release=librarius -o wide || true
          kubectl -n "$NAMESPACE" describe pods -l release=librarius | sed -n '/^Events:/,$p' || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -40 || true

  # A silent CD failure went unnoticed for 27 days (issue #85): images kept being
  # published while nothing was deployed. Any failure now opens an issue.
  report-failure:
    name: report failure
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One open issue is enough: one per failed run would just be noise.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label ci --search "in:title Deployment failed" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Deployment failed again on \`$GITHUB_SHA\` — $RUN_URL"
          else
            printf '%s\n' \
              "The \`cd\` workflow failed on commit \`$GITHUB_SHA\`." \
              "" \
              "Run: $RUN_URL" \
              "" \
              "Nothing reached \`librarius.zelytra.fr\`. Images may still have been pushed" \
              "to GHCR — check which job failed before assuming the build is at fault." \
              > body.md
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Deployment failed on main" \
              --label ci,infra,P0 \
              --body-file body.md
          fi
