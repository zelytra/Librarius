name: secrets

# Scans the working tree for credentials, so that the ones removed by issue #58
# cannot come back. Runs on every pull request and on the integration branches.
on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push on the same ref supersedes the run in progress.
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Released binary rather than the Docker image: no Docker Hub pull limit,
      # and the version is pinned so a local run matches the CI exactly.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Working tree only (--no-git): the git history still contains the
      # credentials that were committed before #58, and rewriting the history of
      # a public repository is not an option. Rotating them is what closes that
      # exposure — see docs/DEPLOYMENT.md.
      # --redact keeps findings out of the run logs: the report gives the file
      # and the line, never the value.
      - name: Scan the working tree
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-git --redact --verbose --no-banner
