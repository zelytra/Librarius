name: ios-bootstrap

# Creates `apps/mobile/ios/` on a rented macOS machine, for a project whose owner has no Mac
# (#531). `cap add ios` runs CocoaPods and the Xcode command line tools, so it cannot run on
# the Linux runners every other workflow here uses, and it cannot run on the owner's machine
# at all — this workflow is the only path to a native iOS project in this repository.
#
# Run it by hand, from the Actions tab, once: the generated project is then **committed**,
# like `android/` and for the same reasons (.claude/docs/MOBILE.md § 7). Run it again only
# when `@capacitor/ios` moves, and expect to re-apply the hand edits — which is what
# `apps/mobile/scripts/patch-ios-project.sh` is for.
#
# GitHub-hosted macOS runners are free on a public repository; on a private one they bill at
# ten times the Linux rate, so this stays a manual trigger rather than part of `mobile.yml`.
on:
  workflow_dispatch:
    inputs:
      push_branch:
        description: 'Also push the generated project to a branch (ios-bootstrap)'
        type: boolean
        default: false

concurrency:
  group: ios-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    name: cap add ios
    runs-on: macos-latest
    # Write access only so the optional last step can push the generated project to a branch
    # of its own; nothing here touches main, which is protected anyway.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail early if the project already exists
        run: |
          if [ -d apps/mobile/ios ]; then
            echo "::error::apps/mobile/ios is already committed. Delete it deliberately before regenerating — cap add overwrites hand edits (.claude/docs/MOBILE.md § 7)."
            exit 1
          fi

      # `cap add ios` copies the template and then syncs, which needs the web bundle to
      # exist: webDir points at apps/web/dist.
      - name: Build the web bundle
        run: pnpm mobile:build

      - name: Add the iOS platform
        run: pnpm --filter @librarius/mobile add:ios

      - name: Apply the hand edits
        run: bash apps/mobile/scripts/patch-ios-project.sh apps/mobile/ios/App/App/Info.plist

      - name: Copy the web bundle into the new project
        run: pnpm mobile:build

      # Pods/ and the build output are regenerated by `pod install` and by every build; the
      # template's own .gitignore already excludes them, this only checks the result is sane.
      - name: Show what was generated
        run: |
          echo "### Generated project" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find apps/mobile/ios -maxdepth 3 -not -path '*/Pods/*' -not -path '*/build/*' | head -40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the generated project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: librarius-ios-project
          # The web bundle and the build output are copied in by every build and belong to
          # neither git nor this artifact. Capacitor 8 uses Swift Package Manager, so there
          # is no Pods directory to exclude.
          path: |
            apps/mobile/ios
            !apps/mobile/ios/App/build
            !apps/mobile/ios/App/App/public
          retention-days: 14

      # Optional, and off by default: downloading the artifact and committing it from a
      # checkout is the reviewable path. This exists so that an owner with no Mac and no
      # checkout at hand can still get the project into the repository.
      - name: Push the project to a branch
        if: inputs.push_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b ios-bootstrap
          git add -f apps/mobile/ios
          git commit -m 'feat(mobile): the generated iOS project (#531)'
          # Never forced: if the branch exists, the previous run's project is still there and
          # deleting it is a decision for a human.
          git push origin ios-bootstrap
          echo "::notice::Pushed to ios-bootstrap. Open a pull request from it."
